<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — ERLC Hub</title><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg"></head>
<body class="dashboard-body"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">E</span><span>ERLC<span>Hub</span></span></a><div class="side-section">MANAGE</div><button class="side-link active" data-page="overview"><b>◫</b> Overview</button><button class="side-link" data-page="settings"><b>⚙</b> Settings</button><button class="side-link" data-page="integrations"><b>⌁</b> Integrations</button><div class="side-section">SERVERS</div><div id="guild-list" class="guild-list"><a class="side-link" href="/auth/login">+ Add server</a></div></aside>
<main class="dash-main"><header class="dash-head"><div><small>DASHBOARD</small><h1 id="page-title">Overview</h1></div><div class="profile" id="profile"><a href="/auth/login">Login with Discord</a></div></header>
<section id="overview-page" class="dash-page"><div id="guild-banner" class="guild-banner"><div><small>SELECTED SERVER</small><h2 id="guild-name">Choose a server</h2></div><button id="save-banner" class="button small">Save changes</button></div><div class="dash-grid"><article class="panel"><small>BOT STATUS</small><div class="big-status"><i></i><strong>Online</strong></div></article><article class="panel"><small>MEMBERS</small><strong class="metric">—</strong></article><article class="panel"><small>ER:LC SERVER</small><strong class="metric" id="erlc-status">Not set</strong></article></div><div class="panel config-preview"><div class="panel-title"><div><small>QUICK SETTINGS</small><h3>Community configuration</h3></div></div><div id="quick-settings"></div></div></section>
<section id="settings-page" class="dash-page hidden"><div class="panel form-panel"><h3>General settings</h3><label>Command prefix<input id="prefix" maxlength="5" placeholder="!"></label><label>Welcome channel ID<input id="welcome_channel" placeholder="Discord channel ID"></label><label>Log channel ID<input id="log_channel" placeholder="Discord channel ID"></label><label>Status channel ID<input id="status_channel" placeholder="Discord channel ID"></label><label>Accent color<input id="accent_color" type="color" value="#7c3aed"></label><button id="save-settings" class="button">Save settings</button></div></section>
<section id="integrations-page" class="dash-page hidden"><div class="panel form-panel"><h3>Emergency Response: Liberty County</h3><label>ER:LC server ID<input id="erlc_server_id" placeholder="Server ID"></label><label>Private API key<input id="erlc_api_key" type="password" placeholder="Optional API key"></label><button id="save-integrations" class="button">Save integration</button></div></section></main>
<script src="/dashboard.js" defer></script></body></html>
